<style>
:root{--azul:#004A80;--verde:#008577;--verde-claro:#E3F1EE;--amarelo:#FDB913;--amarelo-claro:#FFF6DD;--cinza:#666666;--linha:rgba(102,102,102,.35);--fundo:#F4F7FA;--card:#fff;--texto:#262626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--texto);font:16px/1.3 Arial,Calibri,sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
header{background:var(--azul);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
header b{display:block;font-size:17px}
header span{font-size:13px;opacity:.9}
.topo{position:sticky;top:0;z-index:5;background:var(--fundo);padding:10px 12px 8px;border-bottom:1px solid var(--linha)}
.abas{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.abas button{min-height:46px;border:1px solid var(--azul);background:var(--card);color:var(--azul);border-radius:8px;font:bold 14px Arial,sans-serif}
.abas button.ativa{background:var(--azul);color:#fff}
.linha{display:flex;gap:8px;margin-top:8px}
input{min-height:44px;border:1px solid var(--linha);border-radius:8px;padding:0 10px;font:16px Arial,sans-serif;background:var(--card);color:var(--texto);min-width:0}
#data{flex:0 0 150px}#busca{flex:1}
.placar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.placar div{background:var(--card);border:1px solid var(--linha);border-radius:8px;text-align:center;padding:5px 2px;font-size:12px;color:var(--cinza)}
.placar b{display:block;font-size:21px;color:var(--texto)}
#info{font-size:12px;color:var(--cinza);padding:8px 14px 0}
main{padding:6px 12px;max-width:760px;margin:auto}
.aluno{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--linha);border-radius:8px;padding:7px 8px;margin-bottom:6px}
.aluno.P{background:var(--verde-claro);border-color:var(--verde)}
.aluno.F{background:var(--amarelo-claro);border-color:var(--amarelo)}
.num{width:24px;text-align:right;color:var(--cinza);font-size:13px;flex:none}
.nome{flex:1;min-width:0;font-size:15px}
.nome small{display:block;color:var(--cinza);font-size:11px}
.bt{width:50px;height:46px;flex:none;border:1.5px solid var(--linha);background:#fff;border-radius:8px;font:bold 17px Arial,sans-serif;color:var(--cinza)}
.bt.P.on{background:var(--verde);border-color:var(--verde);color:#fff}
.bt.F.on{background:var(--amarelo);border-color:var(--amarelo);color:#262626}
footer{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--linha);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:6px}
footer button{min-height:44px;border:1px solid var(--azul);background:#fff;color:var(--azul);border-radius:8px;font:bold 13px Arial,sans-serif}
footer button.forte{background:var(--azul);color:#fff}
#aviso{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);background:#0B1D2B;color:#fff;padding:9px 14px;border-radius:8px;font-size:14px;display:none;z-index:9;max-width:90%}
noscript div{background:#FFF6DD;padding:14px}
#painel{position:fixed;inset:0;z-index:20;background:var(--fundo);display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));gap:8px}

.acoes .largo{grid-column:1/-1}

#painel-salvas.aberto{display:flex}
#painel-salvas b{color:var(--azul);font-size:17px}
#lista-salvas{display:flex;flex-direction:column;gap:6px;flex:none;font-size:14px;color:var(--cinza)}
.salva{min-height:46px;text-align:left;padding:8px 10px;border:1px solid var(--azul);background:#fff;color:var(--azul);border-radius:8px;font:bold 14px Arial,sans-serif}
#faltas-acum{flex:1 0 auto;white-space:pre-wrap;background:#fff;border:1px solid var(--linha);border-radius:8px;padding:10px;font-size:14px}
#conf{position:fixed;inset:0;z-index:30;background:rgba(11,29,43,.55);display:none;align-items:center;justify-content:center;padding:16px}
#conf.aberto{display:flex}
#conf>div{background:#fff;border-radius:8px;padding:16px;max-width:420px;width:100%}
#conf p{margin:0 0 14px}
#lembrete{display:none;align-items:center;gap:8px;margin:8px 12px 0;padding:8px 10px;background:var(--amarelo-claro);border:1px solid var(--amarelo);border-radius:8px;font-size:14px}
#lembrete span{flex:1}
#lembrete button{min-height:40px;padding:0 14px;border:0;border-radius:8px;background:var(--azul);color:#fff;font:bold 14px Arial,sans-serif}
#estado{font-size:12px;color:var(--cinza);padding:2px 14px 0;min-height:16px}
#estado.alerta{color:#262626;font-weight:bold}

async function salvarArquivo(nome,dados,tipo){

    var fl=new File([dados],nome,{type:tipo});
    if(navigator.canShare&&navigator.canShare({files:[fl]})){await navigator.share({files:[fl],title:nome});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  var u=URL.createObjectURL(new Blob([dados],{type:tipo})),a=document.createElement('a');
  a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u)},2000);
}
